name: Build and Publish Recommendation System

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: 
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notebooks
        run: |
          jupyter nbconvert --to html --execute Association_Rule_Mining.ipynb
          jupyter nbconvert --to html --execute Movies_info_text.ipynb

      - name: Upload generated HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-reports
          path: "*.html"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
